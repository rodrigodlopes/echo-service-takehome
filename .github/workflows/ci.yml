name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: echo-cluster

      - name: Run CI script
        run: ./scripts/ci.sh
